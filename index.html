<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Day I Can't Forget</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',sans-serif;background:#0f0f0f;color:#eaeaea;line-height:1.7}
  header{height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px;background:linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1500534623283-312a57ea4d8d?q=80&w=2000');background-size:cover;background-position:center}
  header h1{font-family:'Playfair Display',serif;font-size:4rem;max-width:800px;line-height:1.1}
  header p{margin-top:20px;font-size:1.1rem;color:#ccc;max-width:600px}
  .btn{margin-top:30px;padding:14px 32px;border:1px solid #fff;border-radius:30px;color:#fff;text-decoration:none;transition:0.3s}
  .btn:hover{background:#fff;color:#000}
  section{padding:80px 20px;max-width:900px;margin:auto}
  .card{background:#1a1a1a;border-radius:16px;padding:40px;margin-bottom:30px;border:1px solid #2a2a2a}
  .card h2{font-family:'Playfair Display',serif;font-size:2rem;margin-bottom:15px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-top:20px}
  .photo{height:200px;border-radius:12px;background:#222;display:flex;align-items:center;justify-content:center;color:#666;font-size:0.9rem}
  footer{text-align:center;padding:40px;color:#666;font-size:0.85rem;border-top:1px solid #222}
</style>
</head>
<body>
<header>
  <h1>A Day I Can't Forget</h1>
  <p>A personal space to keep memories, stories, and moments that shaped me.</p>
